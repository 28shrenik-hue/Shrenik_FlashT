name: Windows release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release
        shell: cmd
        run: scripts\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: FlashTile-v1.0.0-rc15-win64
          path: release/FlashTile-v1.0.0-rc15-win64.zip
          if-no-files-found: error
